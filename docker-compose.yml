services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env (≥32 caracteres)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      PORT: "3000"
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Passo explícito de migration (não roda sozinho):
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
    command: ["npx", "prisma", "migrate", "deploy", "--config", "prisma7.config.ts"]
    profiles: ["tools"]

volumes:
  pgdata:
